<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal do Patrimônio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon-box"><i class="fa-solid fa-landmark"></i></div>
            <h1>Controle de Patrimônio</h1>
            <small>Prefeitura Municipal de Tauá</small>
        </div>

        <div id="alertaErro" class="alert alert-danger py-2 text-center d-none" role="alert">
            <small><i class="fa-solid fa-triangle-exclamation me-1"></i> Utilizador ou senha inválidos.</small>
        </div>

        <form id="formLogin" onsubmit="fazerLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Login de Acesso</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="loginInput" class="form-control" placeholder="Ex: admin, alocados" required autocomplete="off">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="senhaInput" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-entrar text-white fw-bold w-100 py-2 mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Entrar no Sistema
            </button>

            <a href="index.html" class="btn btn-outline-secondary w-100 py-2 text-decoration-none fw-semibold">
                <i class="fa-solid fa-arrow-left me-2"></i> Voltar para o Início
            </a>
        </form>
    </div>

    <script src="js/database.js"></script>
    <script>
        function fazerLogin(e) {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const senha = document.getElementById('senhaInput').value.trim();

            const usuario = Database.autenticar(login, senha);
            if (usuario) {
                if (usuario.permissao === '1') {
                    window.location.href = 'inicio_adm.html';
                } else if (usuario.permissao === '2') {
                    window.location.href = 'lo.html';
                } else {
                    window.location.href = 'inicio_usuario.html';
                }
            } else {
                document.getElementById('alertaErro').classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
